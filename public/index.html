<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Developer Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .heatmap-placeholder { height: 150px; background: #e9ecef; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Profile Header -->
        <header class="text-center mb-5">
            <h1 class="display-4">Developer Portfolio</h1>
            <p class="lead">Followers: <span id="followerCount">0</span> | Total Stars: <span id="totalStars">0</span></p>
            <div id="matchBadge" class="badge bg-success fs-5 d-none">Match: 0%</div>
        </header>

        <!-- Vibe Check / Job Description Input -->
        <div class="card mb-5 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Tech Stack Compatibility Check</h5>
                <textarea id="jobDescription" class="form-control mb-3" rows="3" placeholder="Paste a job description here..."></textarea>
                <button class="btn btn-primary" onclick="calculateMatch()">Check Vibe</button>
            </div>
        </div>

        <!-- Contribution Graph -->
        <div class="mb-5">
            <h3>Coding Activity</h3>
            <div class="heatmap-placeholder d-flex align-items-center justify-content-center text-muted">
                Contribution Heatmap Grid will render here
            </div>
        </div>

        <!-- Repository Cards -->
        <h3>Top Repositories</h3>
        <div class="row" id="repoContainer">
            <!-- Repo cards will be injected here via JavaScript -->
        </div>
    </div>

    <script>
        function calculateMatch() {
            // Logic to send job description to backend, compare keywords, and display Match Percentage badge
            document.getElementById('matchBadge').classList.remove('d-none');
            document.getElementById('matchBadge').innerText = 'Match: 85%';
        }
    </script>
</body>
</html>
